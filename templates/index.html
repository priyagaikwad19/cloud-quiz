<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cloud Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --paper: #0f1424;
    --surface: #181f35;
    --raised: #212a47;
    --ink: #e8ecf8;
    --muted: #9aa5c4;
    --line: #2b3558;
    --brand: #4569f0;
    --brand-dark: #3453cc;
    --link: #9db4ff;
    --good: #3ecf9a;
    --good-bg: #12392d;
    --bad: #ff7a85;
    --bad-bg: #44181f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: "Nunito Sans", system-ui, sans-serif; font-size: 17px; line-height: 1.55;
  }
  h1, h2, h3, button { font-family: "Sora", system-ui, sans-serif; }
  header { padding: 28px 20px 0; max-width: 720px; margin: 0 auto; }
  header a { color: var(--ink); text-decoration: none; font-family: "Sora", sans-serif; font-weight: 700; font-size: 22px; }
  header a span { color: var(--link); }
  main { max-width: 720px; margin: 0 auto; padding: 24px 20px 80px; }
  h1 { font-size: 30px; line-height: 1.2; margin: 8px 0 6px; }
  h2 { font-size: 22px; margin: 0 0 12px; }
  p.lead { color: var(--muted); margin: 0 0 24px; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px; margin-bottom: 18px; }
  button {
    font-size: 15px; font-weight: 600; border-radius: 10px; border: 1px solid transparent;
    padding: 11px 18px; cursor: pointer; background: var(--brand); color: #fff;
  }
  button:hover { background: var(--brand-dark); }
  button.ghost { background: transparent; color: var(--link); border-color: var(--line); }
  button.ghost:hover { background: var(--raised); }
  button.link { background: none; color: var(--bad); padding: 4px 0; border: none; font-size: 14px; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  :focus-visible { outline: 3px solid #9db4ff; outline-offset: 2px; }
  input[type=text] {
    width: 100%; padding: 11px 13px; font: inherit; border: 1px solid var(--line);
    border-radius: 10px; background: var(--paper); color: var(--ink);
  }
  label.field { display: block; font-weight: 600; margin-bottom: 6px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .space { justify-content: space-between; }
  .quiz-list { list-style: none; margin: 0; padding: 0; }
  .quiz-list li { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 0; border-top: 1px solid var(--line); }
  .quiz-list li:first-child { border-top: none; }
  .quiz-list strong { display: block; font-family: "Sora", sans-serif; font-size: 17px; }
  .meta { color: var(--muted); font-size: 14px; }
  .opt { display: block; width: 100%; text-align: left; margin-bottom: 10px; padding: 14px 16px; background: var(--surface); color: var(--ink); border: 2px solid var(--line); font-family: "Nunito Sans", sans-serif; font-size: 17px; font-weight: 400; }
  .opt:hover { background: var(--raised); }
  .opt.picked { border-color: var(--link); background: #1f2b57; }
  .opt.right { border-color: var(--good); background: var(--good-bg); }
  .opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
  .bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; margin-bottom: 18px; }
  .bar > div { height: 100%; background: var(--brand); transition: width .25s; }
  .opt-input { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
  .opt-input input[type=radio] { accent-color: var(--good); width: 18px; height: 18px; flex: none; }
  .score { font-family: "Sora", sans-serif; font-size: 56px; font-weight: 700; line-height: 1; margin: 4px 0 6px; }
  table { width: 100%; border-collapse: collapse; }
  td, th { text-align: left; padding: 10px 6px; border-top: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; font-size: 14px; border-top: none; }
  td:last-child, th:last-child { text-align: right; }
  .error { background: var(--bad-bg); color: var(--bad); padding: 10px 14px; border-radius: 10px; margin-bottom: 14px; }
  .qblock { border-top: 1px solid var(--line); padding-top: 18px; margin-top: 18px; }
  .qblock:first-of-type { border-top: none; padding-top: 0; margin-top: 0; }
  @media (max-width: 480px) { h1 { font-size: 26px; } .score { font-size: 46px; } }
  @media (prefers-reduced-motion: reduce) { .bar > div { transition: none; } }
</style>
</head>
<body>
<header><a href="#" id="home-link">Cloud<span>Quiz</span></a></header>
<main id="app"></main>

<script>
const app = document.getElementById("app");

function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) el.append(kid instanceof Node ? kid : document.createTextNode(kid));
  return el;
}

async function api(path, opts) {
  const res = await fetch(path, opts);
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || "Something went wrong. Try again.");
  return data;
}
const post = (path, body) => api(path, {
  method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
});

function show(...nodes) { app.replaceChildren(...nodes); window.scrollTo(0, 0); }
document.getElementById("home-link").addEventListener("click", e => { e.preventDefault(); home(); });

/* ---------- Home ---------- */
async function home() {
  let quizzes = [];
  try { quizzes = await api("/api/quizzes"); } catch (e) { /* show empty state */ }
  const list = quizzes.length
    ? h("ul", { class: "quiz-list" }, quizzes.map(q =>
        h("li", {},
          h("div", {}, h("strong", {}, q.title),
            h("span", { class: "meta" }, `${q.count} question${q.count === 1 ? "" : "s"} · ${q.attempts} attempt${q.attempts === 1 ? "" : "s"}`)),
          h("div", { class: "row" },
            h("button", { class: "ghost", onclick: () => board(q.id, q.title) }, "Leaderboard"),
            h("button", { onclick: () => start(q.id) }, "Take quiz"))))
      )
    : h("p", { class: "meta" }, "No quizzes yet. Create the first one.");
  show(
    h("h1", {}, "Make a quiz. Share it. See who scores highest."),
    h("p", { class: "lead" }, "Quizzes and scores are stored in the cloud, so anyone with the link can play."),
    h("div", { class: "row", style: "margin-bottom:18px" }, h("button", { onclick: builder }, "Create a quiz")),
    h("div", { class: "panel" }, h("h2", {}, "Available quizzes"), list)
  );
}

/* ---------- Create ---------- */
let radioId = 0;
function questionBlock() {
  const name = "ans" + (radioId++);
  const opts = [0, 1, 2, 3].map(i =>
    h("div", { class: "opt-input" },
      h("input", { type: "radio", name, value: i, "aria-label": `Option ${i + 1} is correct` }),
      h("input", { type: "text", placeholder: `Option ${i + 1}${i < 2 ? "" : " (optional)"}`, maxlength: 150 })));
  const block = h("div", { class: "qblock" },
    h("label", { class: "field" }, "Question"),
    h("input", { type: "text", placeholder: "Type your question", maxlength: 300 }),
    h("p", { class: "meta", style: "margin:12px 0 8px" }, "Fill in the options and select the circle next to the correct one."),
    opts,
    h("button", { class: "link", onclick: () => block.remove() }, "Remove question"));
  return block;
}

function builder() {
  const errorBox = h("div");
  const title = h("input", { type: "text", placeholder: "For example: Cloud basics", maxlength: 100 });
  const qs = h("div", {}, questionBlock());
  const saveBtn = h("button", { onclick: save }, "Save quiz");

  async function save() {
    const questions = [];
    for (const b of qs.querySelectorAll(".qblock")) {
      const inputs = b.querySelectorAll("input[type=text]");
      const radios = b.querySelectorAll("input[type=radio]");
      const text = inputs[0].value.trim();
      const options = [], map = {};
      for (let i = 0; i < 4; i++) {
        const v = inputs[i + 1].value.trim();
        if (v) { map[i] = options.length; options.push(v); }
      }
      const checked = [...radios].findIndex(r => r.checked);
      questions.push({ text, options, answer: checked in map ? map[checked] : null });
    }
    saveBtn.disabled = true;
    try {
      await post("/api/quizzes", { title: title.value, questions });
      home();
    } catch (e) {
      errorBox.replaceChildren(h("div", { class: "error", role: "alert" }, e.message));
      saveBtn.disabled = false;
    }
  }

  show(
    h("h1", {}, "Create a quiz"),
    h("p", { class: "lead" }, "Add your questions below. Each question needs at least two options and one correct answer."),
    errorBox,
    h("div", { class: "panel" },
      h("label", { class: "field" }, "Quiz title"), title,
      h("div", { style: "margin-top:22px" }, qs)),
    h("div", { class: "row" },
      h("button", { class: "ghost", onclick: () => qs.append(questionBlock()) }, "Add question"),
      saveBtn,
      h("button", { class: "ghost", onclick: home }, "Cancel"))
  );
}

/* ---------- Play ---------- */
async function start(id) {
  let quiz;
  try { quiz = await api(`/api/quizzes/${id}`); } catch (e) { return home(); }
  const name = h("input", { type: "text", placeholder: "Your name", maxlength: 40 });
  const go = () => {
    if (!name.value.trim()) { name.focus(); return; }
    play(quiz, name.value.trim());
  };
  name.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
  show(
    h("h1", {}, quiz.title),
    h("p", { class: "lead" }, `${quiz.questions.length} question${quiz.questions.length === 1 ? "" : "s"}. Enter your name so your score can appear on the leaderboard.`),
    h("div", { class: "panel" }, h("label", { class: "field" }, "Your name"), name,
      h("div", { style: "margin-top:16px" }, h("button", { onclick: go }, "Start quiz")))
  );
  name.focus();
}

function play(quiz, name) {
  const answers = [];
  let i = 0;
  function render() {
    const q = quiz.questions[i];
    let picked = null;
    const next = h("button", { disabled: true }, i === quiz.questions.length - 1 ? "Finish quiz" : "Next question");
    const buttons = q.options.map((o, idx) =>
      h("button", { class: "opt", onclick: () => {
        picked = idx;
        buttons.forEach((b, j) => b.classList.toggle("picked", j === idx));
        next.disabled = false;
      } }, o));
    next.addEventListener("click", async () => {
      answers.push(picked);
      if (++i < quiz.questions.length) return render();
      next.disabled = true;
      try {
        const result = await post(`/api/quizzes/${quiz.id}/submit`, { name, answers });
        results(quiz, answers, result, name);
      } catch (e) { alert(e.message); next.disabled = false; }
    });
    show(
      h("p", { class: "meta" }, `Question ${i + 1} of ${quiz.questions.length}`),
      h("div", { class: "bar" }, h("div", { style: `width:${(i / quiz.questions.length) * 100}%` })),
      h("h2", {}, q.text),
      ...buttons,
      h("div", { style: "margin-top:8px" }, next)
    );
  }
  render();
}

/* ---------- Results ---------- */
async function results(quiz, answers, result, name) {
  const review = quiz.questions.map((q, qi) =>
    h("div", { class: "qblock" },
      h("h3", { style: "font-size:17px;margin:0 0 10px" }, `${qi + 1}. ${q.text}`),
      q.options.map((o, oi) => {
        let cls = "opt";
        if (oi === result.correct[qi]) cls += " right";
        else if (oi === answers[qi]) cls += " wrong";
        return h("div", { class: cls, style: "cursor:default" }, o);
      })));
  const pct = Math.round((result.score / result.total) * 100);
  show(
    h("p", { class: "meta" }, `${name}, here is your result for ${quiz.title}`),
    h("div", { class: "score" }, `${result.score}/${result.total}`),
    h("p", { class: "lead" }, `${pct}% correct`),
    h("div", { class: "row", style: "margin-bottom:18px" },
      h("button", { onclick: () => board(quiz.id, quiz.title) }, "See leaderboard"),
      h("button", { class: "ghost", onclick: () => start(quiz.id) }, "Try again"),
      h("button", { class: "ghost", onclick: home }, "All quizzes")),
    h("div", { class: "panel" }, h("h2", {}, "Review"), review)
  );
}

async function board(id, title) {
  let rows = [];
  try { rows = await api(`/api/quizzes/${id}/leaderboard`); } catch (e) {}
  const table = rows.length
    ? h("table", {},
        h("tr", {}, h("th", {}, "Rank"), h("th", {}, "Name"), h("th", {}, "Score")),
        rows.map((r, i) => h("tr", {}, h("td", {}, String(i + 1)), h("td", {}, r.name), h("td", {}, `${r.score}/${r.total}`))))
    : h("p", { class: "meta" }, "No scores yet. Be the first to take this quiz.");
  show(
    h("h1", {}, "Leaderboard"),
    h("p", { class: "lead" }, title),
    h("div", { class: "panel" }, table),
    h("div", { class: "row" },
      h("button", { onclick: () => start(id) }, "Take quiz"),
      h("button", { class: "ghost", onclick: home }, "All quizzes"))
  );
}

home();
</script>
</body>
</html>
